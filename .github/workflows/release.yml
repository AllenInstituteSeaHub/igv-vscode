# Release pipeline (spec §12 M6). Tagging vX.Y.Z builds the VSIX on Linux and
# attaches it to a GitHub Release, then publishes to each marketplace whose
# secret (VSCE_PAT / OVSX_PAT) is set; a marketplace without a token is skipped
# with a message, never a failure. The publish job can also be started by hand
# (workflow_dispatch with publish=true). Marketplaces without a token are
# published by hand (see docs/RELEASING.md).
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to marketplaces (requires VSCE_PAT and OVSX_PAT secrets)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.pkg.outputs.vsix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm run check
      - name: Package
        id: pkg
        run: |
          npm run package
          echo "vsix=$(ls igv-vscode-*.vsix)" >> "$GITHUB_OUTPUT"
      - name: Verify the packaged publisher is not the placeholder
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pub=$(node -p "require('./package.json').publisher")
          if [ "$pub" = "igv-vscode-dev" ]; then echo "package.json publisher is still the placeholder" >&2; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
          body: |
            Install: `code --install-extension ${{ steps.pkg.outputs.vsix }}` (or `code-server --install-extension …`).
            See CHANGELOG.md for details.

  publish:
    needs: vsix
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - name: Publish to the VS Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath igv-vscode-*.vsix
      - name: Skipped VS Marketplace publish (no VSCE_PAT secret)
        if: env.VSCE_PAT == ''
        run: echo "VSCE_PAT is not set; upload the VSIX manually at https://marketplace.visualstudio.com/manage"
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish igv-vscode-*.vsix
      - name: Skipped Open VSX publish (no OVSX_PAT secret)
        if: env.OVSX_PAT == ''
        run: echo "OVSX_PAT is not set; skipping Open VSX"

